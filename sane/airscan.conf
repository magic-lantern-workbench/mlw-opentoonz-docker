# SANE "airscan" (eSCL / WSD network scanner) configuration for the OpenToonz container.
# Bind-mounted read-only over /etc/sane.d/airscan.conf by docker-compose.yml.
#
# The container runs its own browse-only Avahi daemon (see entrypoint.sh), so network
# scanners are normally discovered automatically, as with `scanimage -L` on the host.
# List a scanner here only to add one that mDNS cannot find (other subnet, mDNS blocked):
#
# [devices]
# "HP LaserJet MFP M234sdw" = https://192.168.1.24:443/eSCL, eSCL
#
# Take the address from `scanimage -L` on the host and append "/eSCL". Use http:// for
# scanners without TLS (usually port 80). Restart the container after editing.
#
# If Avahi cannot start, airscan aborts initialisation and lists nothing, even static
# devices; in that case add `discovery = disable` under [options] to use static entries only.

[devices]

